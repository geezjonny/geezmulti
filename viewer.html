<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Player View · Multi VTT</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><header><a class="brand" href="index.html">MULTI<b> / </b>VTT</a><span class="tag">PLAYER VIEW</span><span id="status" class="status">Connecting…</span></header><main id="stage" class="stage viewer-stage"><section class="viewer-panel" id="panel"><h2>Step into the world.</h2><label for="room">Session code</label><input id="room" maxlength="48" placeholder="Paste your GM’s code"><label for="name">Your player name</label><input id="name" maxlength="40" placeholder="e.g. Rowan"><button id="join" class="full primary" style="margin-top:12px">Join session</button><p id="identity" class="small">Your browser gets a persistent player identity.</p><label for="token">Assigned character</label><select id="token"><option value="">Waiting for assignment…</option></select><button id="enter" class="full" style="margin-top:10px">Enter character view</button><p class="small">The GM moves your token. Drag the view to look around, or enable motion on your phone.</p></section><div class="viewer-controls"><button id="motion">Enable motion</button><button id="recenter">Recenter</button><button id="menu">Session</button><button id="fullscreen">Fullscreen</button></div><div id="view-info" class="stage-label" style="left:auto;right:20px">WAITING FOR CHARACTER</div></main><script type="module" src="js/viewer.js"></script></body></html>
